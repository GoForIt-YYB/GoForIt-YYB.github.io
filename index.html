<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yubo Ye</title>
<style>
  :root { --bg: #fafaf7; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --accent: #0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --accent: #4493f8; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "PingFang SC",
          "Microsoft YaHei", sans-serif;
  }
  main { width: 100%; max-width: 32rem; text-align: center; }
  .sign { font-size: 3rem; line-height: 1; margin-bottom: 1rem; }
  h1 { margin: 0 0 .25rem; font-size: 2rem; font-weight: 600; letter-spacing: -.01em; }
  .affil { margin: 0 0 1.5rem; color: var(--muted); }
  .note { margin: 0; padding: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .note span { display: block; color: var(--muted); font-size: .95rem; }
  .links { margin: 1.5rem 0 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <div class="sign" aria-hidden="true">🚧</div>
  <h1>Yubo Ye</h1>
  <p class="affil">Rochester Institute of Technology</p>
  <p class="note">This page is under construction.<span>主页正在施工中。</span></p>
  <p class="links"><a href="https://github.com/GoForIt-YYB">GitHub</a></p>
</main>
</body>
</html>
